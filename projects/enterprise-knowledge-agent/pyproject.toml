[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "A tenant-aware RAG and ticket escalation agent for learning and interviews."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.118,<1",
  "langgraph>=1.0,<2",
  "openai>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client[fastembed]>=1.15,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

